# Supabase pauses free projects after 7 days without activity. This pings the
# public menu every 3 days so the app never goes offline during quiet periods.
name: Keep backend awake

on:
  schedule:
    - cron: "17 3 */3 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then echo "SUPABASE_URL not set — skipping"; exit 0; fi
          AUTH=()
          case "$SUPABASE_ANON_KEY" in eyJ*) AUTH=(-H "Authorization: Bearer $SUPABASE_ANON_KEY");; esac
          curl -fsS -X POST "$SUPABASE_URL/rest/v1/rpc/restaurant_status" \
            -H "apikey: $SUPABASE_ANON_KEY" "${AUTH[@]}" -H "Content-Type: application/json" -d '{}'
