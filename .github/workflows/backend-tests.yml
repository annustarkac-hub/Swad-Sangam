# Applies every database migration to a throw-away PostgreSQL and runs the
# business-rule and security tests (pricing, order states, permissions).
name: Backend tests

on:
  push:
    paths: ["supabase/**", ".github/workflows/backend-tests.yml"]
  pull_request:
    paths: ["supabase/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v7
      - run: ./supabase/tests/run_local.sh
