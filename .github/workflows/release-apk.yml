# Publishes the Android app as a free direct download (no Play Store needed).
# Every run creates a GitHub Release with "swad-sangam.apk". The website's
# "Android app" button always points to the latest one:
#   https://github.com/<owner>/<repo>/releases/latest/download/swad-sangam.apk
# Needs the signing-key secrets (run "Create signing key" once) so that every new
# version installs as an UPDATE over the old one.
name: Release Android APK

on:
  workflow_dispatch:
    inputs:
      notes:
        description: "What changed (shown on the release page)"
        default: "Menu and app improvements"
  push:
    branches: [main]
    paths: ["android/**"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - name: Check required secrets
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::error::Signing key missing. Add the ANDROID_KEYSTORE_PASSWORD secret, run 'Create signing key (run once)', then add ANDROID_KEYSTORE_BASE64 — steps are at the top of create-signing-key.yml."
            exit 1
          fi
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_ANON_KEY secrets are missing."
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Optional Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: if [ -n "$GOOGLE_SERVICES_JSON" ]; then echo "$GOOGLE_SERVICES_JSON" > app/google-services.json; fi
      - name: Signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Test and build signed APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'swadsangam' }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease :staffapp:assembleAdminRelease :staffapp:assembleStaffRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/swad-sangam.apk"
          cp staffapp/build/outputs/apk/admin/release/staffapp-admin-release.apk "$RUNNER_TEMP/swad-sangam-admin.apk"
          cp staffapp/build/outputs/apk/staff/release/staffapp-staff-release.apk "$RUNNER_TEMP/swad-sangam-staff.apk"
          for f in swad-sangam swad-sangam-admin swad-sangam-staff; do
            "$ANDROID_HOME"/build-tools/*/apksigner verify "$RUNNER_TEMP/$f.apk"
            sha256sum "$RUNNER_TEMP/$f.apk" | cut -d' ' -f1 > "$RUNNER_TEMP/$f.apk.sha256"
          done
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: Swad Sangam app 1.1.${{ github.run_number }}
          make_latest: true
          body: |
            ${{ inputs.notes || 'Menu and app improvements' }}

            **Customer app:** `swad-sangam.apk` · **Admin (owner/manager):** `swad-sangam-admin.apk` · **Staff (POS / kitchen):** `swad-sangam-staff.apk`

            **Install:** download the APK on the Android phone → open it → allow “Install unknown apps” for your browser/WhatsApp → Install.
            Updating: install the new APK over the old one; your orders stay.
          files: |
            ${{ runner.temp }}/swad-sangam.apk
            ${{ runner.temp }}/swad-sangam.apk.sha256
            ${{ runner.temp }}/swad-sangam-admin.apk
            ${{ runner.temp }}/swad-sangam-admin.apk.sha256
            ${{ runner.temp }}/swad-sangam-staff.apk
            ${{ runner.temp }}/swad-sangam-staff.apk.sha256
